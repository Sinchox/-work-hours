<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<title>Work Hours</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827}
main{max-width:520px;margin:auto;padding:18px 16px 40px}.card{background:white;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 3px 14px #0000000b}
h1{font-size:28px;margin:4px 0}.muted{color:#6b7280}.big{font-size:34px;font-weight:800;margin:8px 0 2px}
button{border:0;border-radius:14px;padding:15px 18px;font-size:17px;font-weight:700;width:100%;margin-top:10px}
.start{background:#16a34a;color:white}.stop{background:#dc2626;color:white}.secondary{background:#e5e7eb;color:#111827}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}
.stat{background:#f9fafb;border-radius:14px;padding:12px}.stat b{font-size:20px;display:block}.days{max-height:420px;overflow:auto}
.day{padding:12px 0;border-bottom:1px solid #eee}.day:last-child{border:0}
input{font-size:17px;padding:12px;border:1px solid #d1d5db;border-radius:12px;width:100%}
small{color:#6b7280}.status{font-size:13px}.ok{color:#15803d}.warn{color:#b45309}
</style>
</head>
<body>
<main>
<div class="card">
  <div class="row">
    <div><h1>Work Hours</h1><div class="muted" id="monthLabel"></div></div>
    <div>● <span id="syncState">Offline kayıt</span></div>
  </div>
</div>

<div class="card">
  <div class="muted">BUGÜN</div>
  <div class="big" id="todayDate"></div>
  <div id="todayStatus" class="muted">Henüz giriş yapılmadı.</div>
  <button id="startBtn" class="start">▶ İşe Başla</button>
  <button id="stopBtn" class="stop">■ İşi Bitir</button>
  <div class="grid">
    <div class="stat"><small>Başlangıç</small><b id="todayStart">—</b></div>
    <div class="stat"><small>Bitiş</small><b id="todayEnd">—</b></div>
  </div>
  <div class="stat" style="margin-top:10px"><small>Bugünkü süre</small><b id="todayTotal">0:00</b></div>
</div>

<div class="card">
  <div class="muted">BU AY</div>
  <div class="big" id="monthTotal">0:00</div>
  <div class="grid">
    <div class="stat"><small>Çalışılan gün</small><b id="workDays">0</b></div>
    <div class="stat"><small>Ortalama</small><b id="average">0:00</b></div>
  </div>
</div>

<div class="card">
  <div class="row"><b>Geçmiş</b><button id="exportBtn" class="secondary" style="width:auto;margin:0;padding:10px 12px">Yedekle</button></div>
  <div class="days" id="days"></div>
</div>

<div class="card">
  <b>Veri güvenliği</b>
  <p class="muted">Kayıtlar artık IndexedDB'de tutuluyor. Uygulama internet olmadan da çalışabilir. Google Drive yedekleme sonraki aşamada eklenecek.</p>
  <div class="status" id="dbStatus"></div>
</div>
</main>
<script src="app.js"></script>
</body>
</html>
